# 构建发行版：push main 做构建检查（zip 仅存为 workflow artifact 供下载），
# 打 v* 标签时额外创建 GitHub Release 并附上发行 zip。
# 全部复用仓库现有 build.cmd，脚本内置自检（尤其 ab-plugin 的 dumpbin
# x86/导出名校验）在 CI 上同样生效。
name: 构建发行版

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 创建 Release 需要 contents:write（gh 用 GITHUB_TOKEN 认证）
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # hr-manager 带 GUI 栈依赖（wry/tao/tray-icon），Cargo.lock 已锁版本，
      # CI 有网直接拉；只需保证 cargo 够新（lockfile 是 v4）
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # 五个 build.cmd 全部靠 vswhere 定位 MSVC、无本机硬编码路径，
      # windows-latest 预装的 VS Build Tools 即满足（含 x86 工具集）
      - name: 构建 hr-daemon（x64）
        shell: cmd
        run: chcp 65001 >nul && daemon\build.cmd

      - name: 构建 Afterburner 插件（必须 x86，脚本内 dumpbin 自检）
        shell: cmd
        run: chcp 65001 >nul && ab-plugin\build.cmd

      - name: 构建 TrafficMonitor 插件（x64）
        shell: cmd
        run: chcp 65001 >nul && tm-plugin\build.cmd

      - name: 构建 hr-manager（Rust + WebView2 GUI）
        shell: cmd
        run: chcp 65001 >nul && tools\hr-manager\build.cmd

      # 发行包组装/版本一致性校验/示例 ini 生成都收在 scripts\pack.ps1 里，
      # 本地打包和 CI 走同一条路。tag 推送用 tag 名命名，main 推送用 dev-<短SHA>
      - name: 组装发行包（scripts\pack.ps1：校验版本一致 + 组装规范布局 + zip）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "HRMonitor-$($env:GITHUB_REF_NAME)-win64" }
                  else { "HRMonitor-dev-$($env:GITHUB_SHA.Substring(0, 7))-win64" }
          scripts/pack.ps1 -Name $name

      - name: 上传构建产物（每次运行均可下载）
        uses: actions/upload-artifact@v4
        with:
          name: HRMonitor-win64
          path: dist/*.zip
          if-no-files-found: error

      # 仅打标签时发布；同名 Release 已存在（重跑工作流）则改为覆盖上传
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path "dist/HRMonitor-$($env:GITHUB_REF_NAME)-win64.zip").Path
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $zip --title "HRMonitor $env:GITHUB_REF_NAME" --generate-notes
          }
